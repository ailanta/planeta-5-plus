<style>
#kids-design { --kids-bg:#edf3ff; --kids-panel:#ffffff; --kids-ink:#17213b; --kids-muted:#66708a; --kids-accent:#645cff; --kids-accent-soft:#eceaff; --kids-warm:#ffbf47; --kids-success:#38b990; --kids-radius:24px; color:var(--kids-ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:6px; }
#kids-design * { box-sizing:border-box; }
#kids-design .kids-directions { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
#kids-design .kids-direction { min-height:44px; border:1px solid var(--border); border-radius:12px; padding:0 14px; color:var(--foreground); background:transparent; }
#kids-design .kids-direction[aria-pressed="true"] { color:var(--primary-foreground); background:var(--primary); }
#kids-design .kids-phone { width:min(100%,390px); margin:auto; overflow:hidden; border-radius:34px; color:var(--kids-ink); background:var(--kids-bg); box-shadow:0 18px 50px color-mix(in srgb,var(--foreground) 16%,transparent); }
#kids-design .kids-status { display:flex; justify-content:space-between; padding:18px 20px 8px; font-size:12px; font-weight:500; }
#kids-design .kids-header { display:flex; align-items:center; gap:12px; padding:8px 18px 14px; }
#kids-design .kids-close { display:grid; width:44px; height:44px; place-items:center; border:0; border-radius:50%; color:var(--kids-muted); background:color-mix(in srgb,var(--kids-panel) 82%,transparent); }
#kids-design .kids-progress { flex:1; height:8px; overflow:hidden; border-radius:20px; background:color-mix(in srgb,var(--kids-muted) 18%,transparent); }
#kids-design .kids-progress span { display:block; width:42%; height:100%; background:var(--kids-success); }
#kids-design .kids-floor-count { color:var(--kids-success); font-size:12px; font-weight:500; }
#kids-design .kids-scene { position:relative; height:132px; overflow:hidden; background:linear-gradient(180deg,color-mix(in srgb,var(--kids-accent) 16%,var(--kids-bg)),var(--kids-bg)); }
#kids-design .kids-cloud { position:absolute; width:72px; height:18px; border-radius:20px; background:color-mix(in srgb,var(--kids-panel) 65%,transparent); }
#kids-design .kids-cloud.a { left:26px; top:25px; } #kids-design .kids-cloud.b { right:18px; top:48px; width:48px; }
#kids-design .kids-building { position:absolute; left:50%; bottom:0; width:88px; transform:translateX(-50%); }
#kids-design .kids-floor { height:10px; margin-top:3px; border-radius:3px; background:linear-gradient(90deg,var(--kids-accent),color-mix(in srgb,var(--kids-accent) 70%,white)); }
#kids-design .kids-crane { position:absolute; left:calc(50% + 48px); bottom:18px; color:var(--kids-warm); font-size:28px; }
#kids-design .kids-repair { display:flex; align-items:center; gap:10px; margin:12px 16px; padding:11px 13px; border-radius:16px; color:color-mix(in srgb,var(--kids-ink) 82%,#8a5a00); background:color-mix(in srgb,var(--kids-warm) 25%,var(--kids-panel)); font-size:12px; }
#kids-design .kids-repair strong,#kids-design .kids-repair span { display:block; }
#kids-design .kids-repair strong { font-size:13px; }
#kids-design .kids-task { margin:0 12px 14px; padding:20px 16px 16px; border-radius:var(--kids-radius); background:var(--kids-panel); box-shadow:0 12px 30px color-mix(in srgb,var(--kids-accent) 10%,transparent); }
#kids-design .kids-level { color:var(--kids-accent); font-size:11px; font-weight:500; letter-spacing:.12em; }
#kids-design .kids-instruction { margin:13px 0 10px; color:var(--kids-muted); font-size:15px; }
#kids-design .kids-word { display:flex; align-items:center; justify-content:center; min-height:82px; margin-bottom:17px; border-radius:18px; background:var(--kids-accent-soft); font-size:36px; font-weight:500; letter-spacing:.04em; }
#kids-design .kids-blank { display:inline-grid; width:40px; height:48px; margin:0 3px; place-items:center; border:3px solid var(--kids-warm); border-radius:12px; color:#7b5100; background:color-mix(in srgb,var(--kids-warm) 28%,white); box-shadow:0 4px 0 var(--kids-warm); line-height:1; }
#kids-design .kids-choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
#kids-design .kids-choice { min-height:58px; border:2px solid color-mix(in srgb,var(--kids-muted) 20%,transparent); border-radius:16px; color:var(--kids-ink); background:var(--kids-panel); font-size:25px; font-weight:500; }
#kids-design .kids-choice:hover { border-color:var(--kids-accent); background:var(--kids-accent-soft); }
#kids-design .kids-confidence { display:flex; gap:7px; margin:14px 0; }
#kids-design .kids-confidence button { min-height:44px; flex:1; border:0; border-radius:13px; color:var(--kids-muted); background:color-mix(in srgb,var(--kids-muted) 9%,var(--kids-panel)); font-size:12px; }
#kids-design .kids-submit { width:100%; min-height:54px; border:0; border-radius:15px; color:white; background:var(--kids-accent); font-weight:500; }
#kids-design[data-mood="adventure"] { --kids-bg:#fff7e9; --kids-panel:#fffdf8; --kids-ink:#2d2a24; --kids-muted:#786d5d; --kids-accent:#ea6b58; --kids-accent-soft:#ffead8; --kids-warm:#ffbd2f; --kids-success:#45ad79; }
#kids-design[data-mood="night"] { --kids-bg:#151a36; --kids-panel:#222849; --kids-ink:#f5f6ff; --kids-muted:#abb2d2; --kids-accent:#8b84ff; --kids-accent-soft:#30365f; --kids-warm:#ffd15c; --kids-success:#5ce0b8; }
@media(max-width:420px){#kids-design{padding:0}#kids-design .kids-phone{border-radius:24px}#kids-design .kids-directions{justify-content:flex-start}}
</style>
<div id="kids-design" data-mood="city" aria-label="Варианты оформления игрового экрана">
  <div class="kids-directions" role="group" aria-label="Направление дизайна">
    <button class="kids-direction" type="button" data-mood="city" aria-pressed="true">Утренний город</button>
    <button class="kids-direction" type="button" data-mood="adventure" aria-pressed="false">Приключение</button>
    <button class="kids-direction" type="button" data-mood="night" aria-pressed="false">Ночной город</button>
  </div>
  <section class="kids-phone" aria-label="Макет задания на телефоне">
    <div class="kids-status"><span>9:41</span><span>● ● ●</span></div>
    <div class="kids-header">
      <button class="kids-close" type="button" aria-label="Закончить игру">×</button>
      <div class="kids-progress" role="progressbar" aria-label="Прогресс сессии" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><span></span></div>
      <span class="kids-floor-count">+4 этажа</span>
    </div>
    <div class="kids-scene">
      <div class="kids-cloud a"></div><div class="kids-cloud b"></div>
      <div class="kids-building"><div class="kids-floor"></div><div class="kids-floor"></div><div class="kids-floor"></div><div class="kids-floor"></div><div class="kids-floor"></div><div class="kids-floor"></div></div>
      <span class="kids-crane" aria-hidden="true">⌁</span>
    </div>
    <div class="kids-repair"><span aria-hidden="true">🔧</span><div><strong>Чиним знакомый этаж</strong><span>Это слово уже встречалось раньше</span></div></div>
    <div class="kids-task">
      <div class="kids-level">УРОВЕНЬ ×1 · РАЗМИНКА</div>
      <p class="kids-instruction">Какая буква пропущена?</p>
      <div class="kids-word" aria-label="Слово трава с пропущенной буквой а">тр<span class="kids-blank">_</span>ва</div>
      <div class="kids-choices"><button class="kids-choice" type="button">а</button><button class="kids-choice" type="button">о</button><button class="kids-choice" type="button">е</button></div>
      <div class="kids-confidence"><button type="button">Уверен</button><button type="button">Нужна подсказка</button></div>
      <button class="kids-submit" type="button">Проверить ответ</button>
    </div>
  </section>
</div>
<script>
const kidsRoot=document.getElementById('kids-design');
const kidsMood={mood:'city',radius:24,showRepair:true};
function kidsRender(){
  kidsRoot.dataset.mood=kidsMood.mood;
  kidsRoot.style.setProperty('--kids-radius',kidsMood.radius+'px');
  kidsRoot.querySelector('.kids-repair').style.display=kidsMood.showRepair?'flex':'none';
  kidsRoot.querySelectorAll('.kids-direction').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mood===kidsMood.mood)));
}
kidsRoot.querySelectorAll('.kids-direction').forEach(button=>button.addEventListener('click',()=>{kidsMood.mood=button.dataset.mood;kidsRender()}));
kidsRender();
if(globalThis.Tweak){
  const kidsTweak=new Tweak({container:kidsRoot,onChange:kidsRender});
  kidsTweak.addSelect(kidsMood,'mood',{label:'Настроение',options:[{label:'Утренний город',value:'city'},{label:'Приключение',value:'adventure'},{label:'Ночной город',value:'night'}],reference:'kids.mood'});
  kidsTweak.addSlider(kidsMood,'radius',{label:'Скругление карточки',min:10,max:32,unit:'px',reference:'--kids-radius'});
  kidsTweak.addToggle(kidsMood,'showRepair',{label:'Показать ремонт',reference:'kids.showRepair'});
}
</script>
